version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artup-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: artup
      POSTGRES_PASSWORD: artup_dev_password
      POSTGRES_DB: artup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
