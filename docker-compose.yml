version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - artup-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artup}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artup-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-artup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artup}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      EMAIL_SERVER: ${EMAIL_SERVER}
      EMAIL_FROM: ${EMAIL_FROM}
    networks:
      - artup-network
    command: sh -c "npx prisma migrate deploy && node server.js"

  caddy:
    image: caddy:2-alpine
    container_name: artup-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    networks:
      - artup-network

networks:
  artup-network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
