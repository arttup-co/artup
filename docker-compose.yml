version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artup-app
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/artup.db
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      EMAIL_SERVER: ${EMAIL_SERVER}
      EMAIL_FROM: ${EMAIL_FROM}
    volumes:
      - sqlite_data:/data
    networks:
      - artup-network
    command: sh -c "npx prisma migrate deploy && node server.js"

  caddy:
    image: caddy:2-alpine
    container_name: artup-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    networks:
      - artup-network

networks:
  artup-network:
    driver: bridge

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
